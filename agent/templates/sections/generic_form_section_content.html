{% load i18n %}
<div class="generic-form-body space-y-4" data-action="{{ submit_url }}">
    {% csrf_token %}
    
    <div class="grid grid-cols-1 gap-4">
        {% for field in form %}
            <div class="flex flex-col gap-1">
                <label class="text-xs font-semibold text-gray-500 dark:text-gray-400">
                    {{ field.label }}
                    {% if field.field.required %}<span class="text-red-500">*</span>{% endif %}
                </label>
                
                {{ field }}
                
                {% if field.errors %}
                    {% for error in field.errors %}
                        <p class="text-xs text-red-500 font-medium mt-1">{{ error }}</p>
                    {% endfor %}
                {% endif %}
            </div>
        {% endfor %}
    </div>

    <div class="flex justify-end gap-3 pt-4 border-t border-gray-100 dark:border-gray-800 mt-4">
        <button type="button" class="generic-form-submit-btn bg-primary-600 text-white px-4 py-2 rounded-md text-xs font-semibold hover:bg-primary-500 transition-colors shadow-sm inline-flex items-center gap-1.5 cursor-pointer">
            <span class="material-symbols-outlined text-[16px]">save</span>
            {% trans "Save Details" %}
        </button>
    </div>
</div>
