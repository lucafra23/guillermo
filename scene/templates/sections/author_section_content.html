{% load i18n %}

{% if description %}
    <p class="mb-4 text-sm text-gray-500 dark:text-gray-400">{{ description }}</p>
{% endif %}

<div class="overflow-x-auto">
    <table class="w-full text-left text-sm">
        <thead class="bg-gray-50 text-xs uppercase text-gray-700 dark:bg-gray-800 dark:text-gray-400">
            <tr>
                {% for header in table.headers %}
                    <th scope="col" class="px-6 py-3">{{ header }}</th>
                {% endfor %}
            </tr>
        </thead>
        <tbody>
            {% for row in table.rows %}
                <tr class="border-b bg-white hover:bg-gray-50 dark:border-gray-700 dark:bg-gray-900 dark:hover:bg-gray-800/50">
                    {% for cell in row %}<td class="px-6 py-4">{{ cell }}</td>{% endfor %}
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
