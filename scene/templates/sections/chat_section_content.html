{% load i18n unfold %}
<div class="p-4 border-b border-gray-200 dark:border-gray-800 bg-gray-100 dark:bg-gray-950">
    <div id="chat-form-{{ instance.id }}" class="chat-form" data-object-id="{{ instance.id }}" data-url="{{ chat_submit_url }}">
        {% csrf_token %}
        <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
            <textarea name="{{ form.chat_input.name }}"
                      id="{{ form.chat_input.id_for_label }}"
                      rows="1"
                      placeholder="{% trans 'Type your message...' %}"
                      class="flex-grow appearance-none border border-base-200 bg-white font-medium min-w-20 placeholder-base-400 rounded-default shadow-xs text-font-default-light text-sm focus:outline-2 focus:-outline-offset-2 focus:outline-primary-600 group-[.errors]:border-red-600 focus:group-[.errors]:outline-red-600 dark:bg-base-900 dark:border-base-700 dark:text-font-default-dark dark:group-[.errors]:border-red-500 dark:focus:group-[.errors]:outline-red-500 dark:scheme-dark group-[.primary]:border-transparent disabled:!bg-base-50 dark:disabled:!bg-base-800 px-3 py-2 w-full max-w-4xl"
            >{{ form.chat_input.value|default_if_none:"" }}</textarea>

            <select name="{{ form.action.name }}"
                    id="{{ form.action.id_for_label }}"
                    class="w-full sm:w-auto appearance-none border border-base-200 bg-white font-medium rounded-default shadow-xs text-font-default-light text-sm focus:outline-2 focus:-outline-offset-2 focus:outline-primary-600 dark:bg-base-900 dark:border-base-700 dark:text-font-default-dark px-3 py-2 pr-8 bg-no-repeat" >
                {% for value, text in form.action.field.choices %}
                    <option value="{{ value }}" {% if form.action.value|stringformat:"s" == value|stringformat:"s" %}selected{% endif %}>{{ text }}</option>
                {% endfor %}
            </select>
            
            <button type="button" class="chat-submit-btn px-4 py-2.5 rounded-md bg-primary-600 text-white hover:bg-primary-500 transition-colors disabled:bg-gray-400 disabled:opacity-70 flex-shrink-0 flex items-center justify-center">
                <span class="material-symbols-outlined text-xl">send</span>
                <span class="ml-2">{% trans "Send" %}</span>
            </button>
        </div>
    </div>
</div>

<div id="chat-messages-{{ instance.id }}" class="flex-grow overflow-y-auto p-4 space-y-6 bg-gray-50 dark:bg-gray-900/50">
    {% include "sections/chat_messages.html" %}
    <script>
        (function() {
            const chatContainer = document.getElementById('chat-messages-{{ instance.id }}');
            // Use a small timeout to ensure the browser has rendered the content before scrolling
            setTimeout(() => { chatContainer.scrollTop = chatContainer.scrollHeight; }, 50);
        })();
    </script>
</div>
