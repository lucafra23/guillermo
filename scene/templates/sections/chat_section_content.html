{% load i18n unfold %}
<div class="p-4 space-y-6">
    {% include "sections/chat_messages.html" %}
</div>
<script>
    (function() {
        const chatContainer = document.getElementById('chat-messages-{{ instance.id }}');
        if (chatContainer) {
            // Use requestAnimationFrame to ensure scrolling happens after the DOM is painted.
            requestAnimationFrame(() => {
                chatContainer.scrollTop = 0;
            });
        }
    })();
</script>
