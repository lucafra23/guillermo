{% load i18n unfold %}

<div
    class="relative w-full bg-white rounded-lg shadow-sm dark:bg-gray-900 border border-gray-200 dark:border-gray-800"
    x-data="{
        isLoaded: {{ is_loaded|yesno:'true,false' }},
        isLoading: false,
        isCollapsed: {{ collapsible|yesno:'true,false' }},
        refreshSection() {
            if (this.isLoading) return;
            this.isLoading = true;
            this.isLoaded = false;
            const container = this.$refs.content;
            container.innerHTML = `<div class='flex justify-center items-center p-6'><span class='material-symbols-outlined animate-spin text-4xl text-primary-500'>progress_activity</span></div>`;
            
            const baseUrl = '{{ request.path }}';
            const url = `${baseUrl}refresh-section/{{ section_key }}/{{ content_type_id }}/{{ instance.pk }}/`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    container.innerHTML = data.html;
                    this.isLoaded = true;
                })
                .catch(error => console.error('Error loading section:', error))
                .finally(() => this.isLoading = false);
        }
    }"
    x-init="if (!isCollapsed) { refreshSection(); }"
>
    <div class="flex items-center justify-between w-full px-4 py-3" {% if collapsible %} @click="isCollapsed = !isCollapsed; if (!isCollapsed && !isLoaded) { refreshSection(); }" {% endif %}>
        <h3 class="text-lg font-semibold text-gray-900 dark:text-white">{{ title }}</h3>
        <div class="flex items-center gap-x-2">
            <button type="button" @click.stop="refreshSection()" class="cursor-pointer inline-flex items-center gap-1.5 px-2 py-1 text-[10px] font-bold uppercase tracking-wider text-primary-600 hover:text-primary-500 dark:text-primary-400 transition-colors group">
                <span class="material-symbols-outlined text-[16px] group-hover:rotate-180 transition-transform duration-500">refresh</span>
            </button>
            <button type="button" class="flex items-center justify-center w-8 h-8 text-gray-400 transition-colors rounded-full hover:bg-gray-100 hover:text-gray-500 dark:hover:bg-gray-800 dark:hover:text-gray-300">
                <span class="material-symbols-outlined" x-text="isCollapsed ? 'expand_more' : 'expand_less'"></span>
            </button>
        </div>
    </div>
    <div x-show="!isCollapsed" x-ref="content" class="border-t border-gray-200 dark:border-gray-800 p-6" style="display: none;"></div>
</div>
